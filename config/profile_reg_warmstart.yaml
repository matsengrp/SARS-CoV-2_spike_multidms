# Profile: regularized + warmstart (idea #2)
# Tests whether Ridge regression initialization for beta improves
# replicate shift correlation by providing a data-driven starting point.
# Extends profile_regularized: keeps l2reg=1e-2, beta0_ridge=1e-3,
# alpha_init=1, but enables warmstart.
# Note: warmstart sets beta0 and beta from Ridge; explicit beta0_init
# overrides warmstart beta0, so we omit beta0_init to let warmstart drive.
pipelines: [spike]
gpu_ids: null
n_processes: 48

spike:
  fitting:
    alpha_init: {Omicron_BA1: 1.0, Delta: 1.0, Omicron_BA2: 1.0}
    beta0_ridge: 1.0e-3
    l2reg: 1.0e-2
    warmstart: true
